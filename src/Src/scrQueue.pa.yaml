          Control: Classic/TextInput@2.3.2
          Properties:
            Height: =90
            HintText: ="Say what you checked and what you concluded."
            Visible: =locBulkOpen
            Width: =grpBulkCardQU.Width - 56
            X: =grpBulkCardQU.X + 28
            Y: =grpBulkCardQU.Y + 168
      - btnBulkCancelQU:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#0F6CBD")
            BorderThickness: =1
            Color: =ColorValue("#1B1B1B")
            Fill: =ColorValue("#FFFFFF")
            Height: =38
            HoverFill: =ColorValue("#EAF3FB")
            OnSelect: |
              =UpdateContext({locBulkOpen: false})
            Text: ="Cancel"
            Visible: =locBulkOpen
            Width: =130
            X: =grpBulkCardQU.X + grpBulkCardQU.Width - 300
            Y: =grpBulkCardQU.Y + grpBulkCardQU.Height - 60
      - btnBulkApplyQU:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#0F6CBD")
            Color: =ColorValue("#FFFFFF")
            DisplayMode: |
              =If(
                  IsBlank(locBulkStatus) || Len(Trim(txtBulkReasonQU.Text)) < Coalesce(gblCfg.ReasonMin, 10),
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =ColorValue("#0F6CBD")
            Height: =38
            HoverFill: =ColorValue("#0C5A9E")
            OnSelect: |
              =Set(gblBusy, true);
              Set(gblError, {IsVisible: false, Title: "", Detail: ""});
              IfError(
                  Set(
                      gblBulkResult,
                      db_dq_sandbox.dquspBulkDisposition(
                          {
                              ActorUpn: gblActorUpn,
                              ExceptionIdCsv: Concat(colQueueSelected, Text(ExceptionId), ","),
                              ToStatusCode: locBulkStatus,
                              Reason: Trim(txtBulkReasonQU.Text)
                          }
                      )
                  ),
                  Set(gblError, {IsVisible: true, Title: "Bulk disposition failed", Detail: FirstError.Message})
              );
              ClearCollect(colBulkFailures, gblBulkResult.ResultSets.Table2);
              UpdateContext({locBulkOpen: false});
              Notify(
                  Text(Coalesce(First(gblBulkResult.ResultSets.Table1).SucceededCount, 0)) & " updated, " &
                  Text(Coalesce(First(gblBulkResult.ResultSets.Table1).FailedCount, 0)) & " failed.",
                  If(
                      Coalesce(First(gblBulkResult.ResultSets.Table1).FailedCount, 0) > 0,
                      NotificationType.Warning,
                      NotificationType.Success
                  ),
                  6000
              );
              Set(gblBusy, false);
              Select(btnDoLoadQueue)
            Text: ="Apply"
            Visible: =locBulkOpen
            Width: =130
            X: =grpBulkCardQU.X + grpBulkCardQU.Width - 158
            Y: =grpBulkCardQU.Y + grpBulkCardQU.Height - 60
      - txtErrorQU:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#B3261E")
            Fill: =ColorValue("#FDE7EA")
            Height: =42
            Text: =gblError.Title & " — " & gblError.Detail
            Visible: =gblError.IsVisible
            Width: =Parent.Width - 64
            X: =32
            Y: =Parent.Height - 46
