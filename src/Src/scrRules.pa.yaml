Screens:
  scrRules:
    Properties:
      Fill: =ColorValue("#FFFFFF")
      OnVisible: |
        =Set(gblBusy, true);
        Set(gblError, {IsVisible: false, Title: "", Detail: ""});
        UpdateContext({locRulePage: 1, locConfirmKind: ""});
        Select(btnDoLoadRules);
        Set(gblBusy, false)
    Children:
      - grpHeaderRU:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =ColorValue("#0F6CBD")
            Height: =64
            Width: =Parent.Width
      - txtBrandRU:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#FFFFFF")
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =20
            Text: ="Data Trust"
            Width: =260
            X: =32
      - grpNavRU:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =ColorValue("#EEF3F8")
            Height: =48
            Width: =Parent.Width
            Y: =64
      - btnNavWorkRU:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#0F6CBD")
            BorderThickness: =1
            Color: =ColorValue("#1B1B1B")
            Fill: =ColorValue("#FFFFFF")
            Height: =36
            HoverFill: =ColorValue("#EAF3FB")
            OnSelect: =Navigate(scrMyWork, ScreenTransition.None)
            Text: ="My work"
            Width: =104
            X: =24
            Y: =70
      - btnNavQueueRU:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#0F6CBD")
            BorderThickness: =1
            Color: =ColorValue("#1B1B1B")
            Fill: =ColorValue("#FFFFFF")
            Height: =36
            HoverFill: =ColorValue("#EAF3FB")
            OnSelect: |
              =Navigate(
                  scrQueue,
                  ScreenTransition.None,
                  {locInAssignee: "", locInSeverity: "", locInOverdue: false, locInCluster: Blank()}
              )
            Text: ="Queue"
            Width: =88
            X: =136
            Y: =70
      - btnNavClustersRU:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#0F6CBD")
            BorderThickness: =1
            Color: =ColorValue("#1B1B1B")
            Fill: =ColorValue("#FFFFFF")
            Height: =36
            HoverFill: =ColorValue("#EAF3FB")
            OnSelect: =Navigate(scrClusters, ScreenTransition.None)
            Text: ="Clusters"
            Width: =96
            X: =232
            Y: =70
      - btnNavApprovalsRU:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#0F6CBD")
            BorderThickness: =1
            Color: =ColorValue("#1B1B1B")
            Fill: =ColorValue("#FFFFFF")
            Height: =36
            HoverFill: =ColorValue("#EAF3FB")
            OnSelect: =Navigate(scrApprovals, ScreenTransition.None)
            Text: ="Approvals"
            Visible: =gblIsApprover
            Width: =110
            X: =336
            Y: =70
      - btnNavRulesRU:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#0F6CBD")
            Color: =ColorValue("#FFFFFF")
            Fill: =ColorValue("#0F6CBD")
            Height: =36
            HoverFill: =ColorValue("#0C5A9E")
            Text: ="Rules"
            Width: =80
            X: =454
            Y: =70
      - btnDoLoadRules:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |
              =IfError(
                  ClearCollect(
                      colBindings,
                      Filter(
                      db_dq_sandbox.dquspGetRuleList(
                          {
                              ActorUpn: gblActorUpn,
                              ActiveOnly: false,
                              DomainCode: Blank(),
                              TargetLayer: Blank(),
                              Page: locRulePage,
                              PageSize: 50
                          }
                      ).ResultSets.Table1,
                          !IsBlank(BindingId)
                      )
                  ),
                  Set(gblError, {IsVisible: true, Title: "Could not load rules", Detail: FirstError.Message})
              )
            Text: ="load"
            Visible: =false
            Width: =1
            X: =-200
            Y: =-200
      - btnDoSaveBinding:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =1
            OnSelect: |
              =Set(gblBusy, true);
              Set(gblError, {IsVisible: false, Title: "", Detail: ""});
              IfError(
                  Set(
                      gblBindDetail,
                      First(
                          db_dq_sandbox.dquspGetRuleDetail(
                              {ActorUpn: gblActorUpn, BindingId: locSaveBindingId}
                          ).ResultSets.Table1
                      )
                  ),
                  Set(gblError, {IsVisible: true, Title: "Could not read the rule before saving", Detail: FirstError.Message})
              );
              IfError(
                  Set(
                      gblWriteResultRU,
                      First(
                          db_dq_sandbox.dquspUpdateRuleBinding(
                              {
                                  ActorUpn: gblActorUpn,
                                  BindingId: locSaveBindingId,
                                  SeverityOverride: locSaveSeverity,
                                  IsActive: locSaveActive,
                                  IsBlocking: locSaveBlocking,
                                  IsQuarantine: locSaveQuarantine,
                                  ThresholdValue: gblBindDetail.ThresholdValue,
                                  ToleranceAbs: gblBindDetail.ToleranceAbs,
                                  TolerancePct: gblBindDetail.TolerancePct,
                                  MaxExceptionRows: gblBindDetail.MaxExceptionRows,
                                  OwnerUpn: gblBindDetail.OwnerUpn,
                                  EffectiveFrom: gblBindDetail.EffectiveFrom,
                                  EffectiveTo: gblBindDetail.EffectiveTo,
                                  RowVersion: gblBindDetail.RowVersionCol
                              }
                          ).ResultSets.Table1
                      )
                  ),
                  Set(gblError, {IsVisible: true, Title: "The change was not saved", Detail: FirstError.Message})
              );
              Switch(
                  Upper(Coalesce(gblWriteResultRU.Outcome, "")),
                  "OK",
                  Notify("Change recorded against your name. It takes effect on the next run.", NotificationType.Success, 4000),
                  "CONFLICT",
                  Notify("Someone else changed this rule while you were looking at it. The list has been reloaded; nothing was saved.", NotificationType.Warning, 8000),
                  "FORBIDDEN",
                  Notify("You do not have permission to change this rule.", NotificationType.Error, 6000),
                  Notify(Coalesce(gblWriteResultRU.Message, "The change was not saved."), NotificationType.Error, 6000)
              );
              Set(gblBusy, false);
              Select(btnDoLoadRules)
            Text: ="save"
            Visible: =false
            Width: =1
            X: =-200
            Y: =-200
      - txtTitleRU:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#1B1B1B")
            FontWeight: =FontWeight.Semibold
            Size: =24
            Text: ="Rules"
            Width: =160
            X: =32
            Y: =128
      - txtAdminPillRU:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#0F6CBD")
            FontWeight: =FontWeight.Semibold
            Height: =28
            Text: ="Administrator"
            Width: =180
            X: =200
            Y: =136
      - txtSummaryRU:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =ColorValue("#5A6570")
            Height: =28
            Text: |
              =Text(Coalesce(First(colBindings).TotalCount, 0), "[$-en-GB]#,##0") & " bindings, " &
               Text(CountRows(Filter(colBindings, IsActive))) & " active on this page"
            Width: =400
            X: =Parent.Width - 432
            Y: =136
      - grpGridHeadRU:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =ColorValue("#EEF3F8")
            Height: =40
            Width: =Parent.Width - 64
            X: =32
            Y: =184
      - txtHRRule:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#5A6570")
            FontWeight: =FontWeight.Semibold
            Text: ="Rule"
            Width: =420
            X: =48
            Y: =184
      - txtHRApp:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#5A6570")
            FontWeight: =FontWeight.Semibold
            Text: ="Applies to"
            Width: =340
            X: =480
            Y: =184
      - txtHRSev:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#5A6570")
            FontWeight: =FontWeight.Semibold
            Text: ="Severity"
            Width: =176
            X: =Parent.Width - 470
            Y: =184
      - txtHRAct:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#5A6570")
            FontWeight: =FontWeight.Semibold
            Text: ="Active"
            Width: =90
            X: =Parent.Width - 286
            Y: =184
      - txtHRBlk:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#5A6570")
            FontWeight: =FontWeight.Semibold
            Text: ="Blocks the load"
            Width: =140
            X: =Parent.Width - 166
            Y: =184
      - txtHRQtn:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#5A6570")
            FontWeight: =FontWeight.Semibold
            Text: ="Quarantines"
            Width: =120
            X: =Parent.Width - 118
            Y: =184
      - galRulesRU:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 340
            Items: =colBindings
            TemplateSize: =52
            Width: =Parent.Width - 64
            X: =32
            Y: =224
          Children:
            - txtRuleName:
                Control: Label@2.5.1
                Properties:
                  Height: =52
                  Text: =ThisItem.RuleName
                  Width: =420
                  X: =16
            - txtRuleApplies:
                Control: Label@2.5.1
                Properties:
                  Height: =52
                  Text: =ThisItem.TargetSchema & "." & ThisItem.TargetObject
                  Width: =340
                  X: =448
            - drpRuleSeverity:
                Control: DropDown@0.0.45
                Properties:
                  Height: =36
                  Items: =ShowColumns(colLkSeverity, Label)
                  OnChange: |
                    =UpdateContext(
                        {
                            locSaveBindingId: ThisItem.BindingId,
                            locSaveSeverity: LookUp(colLkSeverity, Label = drpRuleSeverity.Selected.Label, Code),
                            locSaveActive: ThisItem.IsActive,
                            locSaveBlocking: ThisItem.IsBlocking,
                            locSaveQuarantine: ThisItem.IsQuarantine
                        }
                    );
                    Select(btnDoSaveBinding)
                  Width: =176
                  X: =Parent.Width - 502
                  Y: =8
            - btnRuleActive:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorValue("#0F6CBD")
                  BorderThickness: =1
                  Color: =If(ThisItem.IsActive, ColorValue("#FFFFFF"), ColorValue("#1B1B1B"))
                  Fill: =If(ThisItem.IsActive, ColorValue("#0F6CBD"), ColorValue("#FFFFFF"))
                  Height: =36
                  OnSelect: |
                    =UpdateContext(
                        {
                            locSaveBindingId: ThisItem.BindingId,
                            locSaveSeverity: ThisItem.SeverityCode,
                            locSaveActive: !ThisItem.IsActive,
                            locSaveBlocking: ThisItem.IsBlocking,
                            locSaveQuarantine: ThisItem.IsQuarantine
                        }
                    );
                    Select(btnDoSaveBinding)
                  Text: =If(ThisItem.IsActive, "On", "Off")
                  Width: =90
                  X: =Parent.Width - 318
                  Y: =8
            - btnRuleBlocking:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorValue("#0F6CBD")
                  BorderThickness: =1
                  Color: =If(ThisItem.IsBlocking, ColorValue("#FFFFFF"), ColorValue("#1B1B1B"))
                  Fill: =If(ThisItem.IsBlocking, ColorValue("#0F6CBD"), ColorValue("#FFFFFF"))
                  Height: =36
                  OnSelect: |
                    =UpdateContext(
                        {
                            locSaveBindingId: ThisItem.BindingId,
                            locSaveSeverity: ThisItem.SeverityCode,
                            locSaveActive: ThisItem.IsActive,
                            locSaveBlocking: !ThisItem.IsBlocking,
                            locSaveQuarantine: ThisItem.IsQuarantine
                        }
                    );
                    If(
                        !ThisItem.IsBlocking,
                        UpdateContext({locConfirmKind: "BLOCKING"}),
                        Select(btnDoSaveBinding)
                    )
                  Text: =If(ThisItem.IsBlocking, "Yes", "No")
                  Width: =90
                  X: =Parent.Width - 198
                  Y: =8
            - btnRuleQuarantine:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorValue("#0F6CBD")
                  BorderThickness: =1
                  Color: =If(ThisItem.IsQuarantine, ColorValue("#FFFFFF"), ColorValue("#1B1B1B"))
                  Fill: =If(ThisItem.IsQuarantine, ColorValue("#0F6CBD"), ColorValue("#FFFFFF"))
                  Height: =36
                  OnSelect: |
                    =UpdateContext(
                        {
                            locSaveBindingId: ThisItem.BindingId,
                            locSaveSeverity: ThisItem.SeverityCode,
                            locSaveActive: ThisItem.IsActive,
                            locSaveBlocking: ThisItem.IsBlocking,
                            locSaveQuarantine: !ThisItem.IsQuarantine
                        }
                    );
                    If(
                        !ThisItem.IsQuarantine,
                        UpdateContext({locConfirmKind: "QUARANTINE"}),
                        Select(btnDoSaveBinding)
                    )
                  Text: =If(ThisItem.IsQuarantine, "Yes", "No")
                  Width: =90
                  X: =Parent.Width - 150
                  Y: =8
      - grpNoticeRU:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =ColorValue("#EEF3F8")
            Height: =88
            Width: =Parent.Width - 64
            X: =32
            Y: =Parent.Height - 108
      - txtNoticeTitleRU:
          Control: Label@2.5.1
          Properties:
            FontWeight: =FontWeight.Semibold
            Height: =26
            Size: =14
            Text: ="You can change severity, and turn a rule on or off."
            Width: =900
            X: =grpNoticeRU.X + 24
            Y: =grpNoticeRU.Y + 16
      - txtNoticeBodyRU:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#5A6570")
            Height: =26
            Text: ="You cannot change what a rule tests. That needs a release, and every change here is recorded against your name."
            Width: =1100
            X: =grpNoticeRU.X + 24
            Y: =grpNoticeRU.Y + 44
      - grpConfScrimRU:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            Visible: =locConfirmKind <> ""
            Width: =Parent.Width
      - grpConfCardRU:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =ColorValue("#FFFFFF")
            Height: =240
            Visible: =locConfirmKind <> ""
            Width: =660
            X: =(Parent.Width - 660) / 2
            Y: =220
      - txtConfTitleRU:
          Control: Label@2.5.1
          Properties:
            FontWeight: =FontWeight.Semibold
            Height: =34
            Size: =18
            Text: =If(locConfirmKind = "BLOCKING", "Stops the load", "Quarantines")
            Visible: =locConfirmKind <> ""
            Width: =grpConfCardRU.Width - 56
            X: =grpConfCardRU.X + 28
            Y: =grpConfCardRU.Y + 28
      - txtConfBodyRU:
          Control: Label@2.5.1
          Properties:
            Height: =90
            Text: |
              =If(
                  locConfirmKind = "BLOCKING",
                  "Turning this on means a failure of this rule will halt promotion for everybody downstream.",
                  "Turning this on means failing rows are held back from the warehouse."
              ) & Char(10) & Char(10) & "This does not change what is reported. It changes what reaches the warehouse."
            Visible: =locConfirmKind <> ""
            Width: =grpConfCardRU.Width - 56
            X: =grpConfCardRU.X + 28
            Y: =grpConfCardRU.Y + 72
      - btnConfCancelRU:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#0F6CBD")
            BorderThickness: =1
            Color: =ColorValue("#1B1B1B")
            Fill: =ColorValue("#FFFFFF")
            Height: =38
            HoverFill: =ColorValue("#EAF3FB")
            OnSelect: |
              =UpdateContext({locConfirmKind: ""}); Select(btnDoLoadRules)
            Text: ="Cancel"
            Visible: =locConfirmKind <> ""
            Width: =130
            X: =grpConfCardRU.X + grpConfCardRU.Width - 300
            Y: =grpConfCardRU.Y + grpConfCardRU.Height - 60
      - btnConfOkRU:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#0F6CBD")
            Color: =ColorValue("#FFFFFF")
            Fill: =ColorValue("#0F6CBD")
            Height: =38
            HoverFill: =ColorValue("#0C5A9E")
            OnSelect: |
              =UpdateContext({locConfirmKind: ""}); Select(btnDoSaveBinding)
            Text: ="Confirm"
            Visible: =locConfirmKind <> ""
            Width: =130
            X: =grpConfCardRU.X + grpConfCardRU.Width - 158
            Y: =grpConfCardRU.Y + grpConfCardRU.Height - 60
      - txtErrorRU:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#B3261E")
            Fill: =ColorValue("#FDE7EA")
            Height: =42
            Text: =gblError.Title & " — " & gblError.Detail
            Visible: =gblError.IsVisible
            Width: =Parent.Width - 64
            X: =32
            Y: =Parent.Height - 46
