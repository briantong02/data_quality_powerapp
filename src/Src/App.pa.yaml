App:
  Properties:
    OnError: |
      =Set(
          gblError,
          {
              IsVisible: true,
              Title: "Something went wrong",
              Detail: FirstError.Message
          }
      )
    OnStart: |
      =Set(gblError, {IsVisible: false, Title: "", Detail: ""});
      Set(gblActorUpn, User().Email);
      Set(
          gblCfg,
          {
              PageSize: 50,
              BulkCap: 500,
              ReasonMin: 10,
              SuppressionReasonMin: 20,
              SuppressionMaxDays: 365
          }
      )
    StartScreen: =scrLoading
    Theme: =PowerAppsTheme
